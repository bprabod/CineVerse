<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Movie details and playback on CineVerse.">
  <title>Title details — CineVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="movie.js"></script>
</head>
<body class="detail-page">
  <header class="site-header detail-site-header" id="top">
    <a class="brand" href="index.html#top" aria-label="CineVerse home">CINE<span>VERSE</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html#top">Home</a><a href="index.html#trending">Discover</a><a href="index.html#movies">Movies</a><a href="index.html#series">Series</a>
    </nav>
    <div class="header-actions">
      <a class="icon-button" href="index.html#searchSection" aria-label="Search movies"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></a>
      <a class="profile-button" href="index.html#top" aria-label="CineVerse home">CV</a>
    </div>
  </header>
  <main class="detail-main">
    <p class="section-kicker" id="detailType">TITLE DETAILS</p>
    <div class="detail-layout">
      <img class="detail-poster" id="detailPoster" src="https://placehold.co/500x750/171717/eeeeee?text=CineVerse" alt="Title poster">
      <section class="detail-copy">
        <h1 id="detailTitle">Loading title…</h1>
        <div class="hero-meta" id="detailMeta"></div>
        <p class="detail-overview" id="detailOverview">Getting title information…</p>
        <div class="detail-actions">
          <button class="button button-primary" id="playButton" type="button">▶ Watch now</button>
          <button class="button button-secondary" id="listButton" type="button">＋ Add to my list</button>
        </div>
        <section class="tv-episode-picker" id="tvEpisodePicker" hidden aria-label="Choose a TV episode">
          <div class="tv-picker-heading">
            <div><p class="section-kicker">START WATCHING</p><h2>Choose your episode</h2></div>
          </div>
          <div class="tv-picker-controls">
            <label>Season
              <select id="seasonSelect" aria-label="Choose season"><option value="">Loading seasons…</option></select>
            </label>
            <label>Episode
              <select id="episodeSelect" aria-label="Choose episode" disabled><option value="">Choose a season first</option></select>
            </label>
            <button class="button button-primary" id="playEpisodeButton" type="button" disabled>▶ Play episode</button>
          </div>
          <p class="detail-muted" id="episodeStatus" role="status"></p>
        </section>
      </section>
    </div>
    <section class="detail-facts" id="detailFacts" aria-label="More title information"></section>
    <section class="detail-extra" id="castSection">
      <div class="detail-section-heading"><p class="section-kicker">THE PEOPLE</p><h2>Cast</h2></div>
      <div class="cast-grid" id="castGrid"><p class="detail-muted">Loading cast…</p></div>
    </section>
    <section class="detail-extra" id="crewSection">
      <div class="detail-section-heading"><p class="section-kicker">BEHIND THE SCENES</p><h2>Director &amp; crew</h2></div>
      <div class="crew-list" id="crewList"></div>
    </section>
    <section class="detail-extra" id="trailerSection" hidden>
      <div class="detail-section-heading"><p class="section-kicker">WATCH THE PREVIEW</p><h2>Trailer</h2></div>
      <a class="button button-secondary" id="trailerLink" href="#" target="_blank" rel="noopener noreferrer">▶ Watch trailer on YouTube</a>
    </section>
    <section class="detail-player" id="playerSection" hidden>
      <div class="player-heading"><h2 id="playerHeading">Now playing</h2><button class="text-button" id="stopButton" type="button">Stop player</button></div>
      <div class="detail-frame-wrap"><iframe id="playerFrame" title="NexStream video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
    </section>
    <p class="detail-status" id="detailStatus" role="status"></p>
  </main>
</body>
</html>
