<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>My Account | CineVerse</title>
  <link rel="icon" href="favicon.svg?v=6">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="auth-client.js"></script>
  <script defer src="account.js?v=3"></script>
</head>
<body class="detail-page">
  <header class="site-header detail-site-header">
    <a class="brand" href="index.html">CINE<span>VERSE</span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="watchlist.html">My List</a></nav>
    <div class="header-actions"><button class="button button-secondary" id="signOut" type="button">Sign out</button></div>
  </header>
  <main class="detail-main" style="max-width:850px;margin:0 auto">
    <p class="section-kicker">CINEVERSE MEMBER AREA</p>
    <h1 style="font-size:clamp(34px,5vw,52px);margin:0 0 12px">Your account</h1>
    <p class="detail-overview" style="margin:0 0 28px">Welcome to your CineVerse account. Your saved movies and series are ready whenever you are.</p>
    <section style="padding:25px;background:#151515;border:1px solid var(--line);border-radius:7px">
      <p class="section-kicker">YOUR USERNAME</p>
      <h2 id="accountUsername" style="font-size:22px;overflow-wrap:anywhere;margin:8px 0 18px">Loading…</h2>
      <p class="section-kicker">SIGNED IN WITH</p>
      <p id="accountEmail" style="font-size:14px;color:#bbb;overflow-wrap:anywhere;margin:8px 0 22px">Checking your account…</p>
      <div class="detail-actions">
        <a class="button button-primary" href="watchlist.html">＋ Open My List</a>
        <a class="button button-secondary" href="index.html">Explore CineVerse</a>
      </div>
      <p id="accountStatus" class="detail-status" role="status"></p>
    </section>
  </main>
</body>
</html>
