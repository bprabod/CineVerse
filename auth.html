<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Sign in | CineVerse</title><link rel="icon" href="favicon.svg?v=6"><link rel="stylesheet" href="style.css?v=password-eye-visible-3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="auth-client.js"></script><script defer src="auth-client-page.js?v=eye-inline-styles-4"></script></head>
<body class="detail-page"><header class="site-header detail-site-header"><a class="brand" href="index.html">CINE<span>VERSE</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="watchlist.html">Watchlist</a></nav></header>
<main class="detail-main" style="max-width:620px;margin:90px auto 0"><p class="section-kicker">YOUR CINEVERSE ACCOUNT</p><h1 id="authTitle" style="font-size:36px">Sign in</h1><p class="detail-overview" id="authDescription">Sign in to access your saved movies and series.</p>
<form id="authForm" style="display:grid;gap:12px"><input id="username" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" placeholder="Username (letters, numbers, underscore)" autocomplete="username" hidden style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><input id="email" type="email" required placeholder="Email address" autocomplete="email" style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><input id="password" type="password" required minlength="6" placeholder="Password (at least 6 characters)" autocomplete="current-password" style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><input id="confirmPassword" type="password" minlength="6" placeholder="Confirm password" autocomplete="new-password" hidden style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><input id="newPassword" type="password" minlength="6" placeholder="New password" autocomplete="new-password" hidden style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><input id="confirmNewPassword" type="password" minlength="6" placeholder="Confirm new password" autocomplete="new-password" hidden style="padding:14px;background:#151515;color:white;border:1px solid #444;border-radius:4px"><button class="button button-primary" type="submit" id="authSubmit">Sign in</button></form>
<p class="detail-status" id="authStatus" role="status"></p><p id="modePrompt">New to CineVerse? <a href="#create" id="modeToggle">Create account</a></p></main></body></html>
