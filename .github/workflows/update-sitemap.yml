name: Update CineVerse sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: write

concurrency:
  group: cineverse-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate sitemap from the current TMDB catalogue
        run: node scripts/generate-sitemap.mjs
      - name: Commit sitemap if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already up to date."
          else
            git commit -m "Update movie and series sitemap"
            git push
          fi
