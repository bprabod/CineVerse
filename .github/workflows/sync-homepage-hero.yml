name: Sync homepage featured movie cache

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

jobs:
  sync-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build cached homepage hero from Supabase
        run: node scripts/generate-hero-cache.mjs
      - name: Commit updated hero cache
        run: |
          git add hero-cache.js
          if git diff --cached --quiet -- hero-cache.js; then
            echo "Homepage hero cache is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-cache.js
          git commit -m "Refresh homepage featured movie cache"
          git push
